
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Porto Painel de aula</title>
    <meta name="description" content="Painel de visualização de horários de aulas em tempo real para o SENAI Vitória com carrossel de mídias dinâmico, sistema de agendamento de salas livres e painel administrativo." />
    <meta property="og:title" content="Porto Painel de aula" />
    <meta property="og:description" content="Painel de visualização de horários de aulas em tempo real para o SENAI Vitória com carrossel de mídias dinâmico, sistema de agendamento de salas livres e painel administrativo." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Biblioteca para processamento de Excel/CSV local -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        overflow-x: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.1);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255,102,0,0.3);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(255,102,0,0.5);
      }
      
      /* Animação para feedback de upload */
      @keyframes pulse-orange {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
      .loading-pulse {
        animation: pulse-orange 1.5s infinite;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
